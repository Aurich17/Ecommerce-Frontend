<div class="w-full h-full card flex justify-content-center align-items-center">
    <p-card header="Recuperar Contraseña" class="w-[80%] md:w-[40%] lg:w-[25%] mx-auto">
        <div class="w-full text-center">Ingresa tu correo electrónico para recibir un enlace de recuperación.</div>
        <form [formGroup]="forgotpassform" class="block p-fluid p-formgrid p-grid gap-2 p-4">
            <div class="field">
                <label class="text-sm font-bold" for="titulo">Correo Electrónico</label>
                <input type="text" pInputText class="w-full text-sm" formControlName="correo" id="titulo">
            </div>

            <p-button
              styleClass="w-full text-sm"
              label="Enviar Enlace"
              [severity]="'warning'"
              (onClick)="enviarCorreoResetPass()"/>

            <div class="w-full text-center text-green-600 pt-4" *ngIf="loading">
                Te hemos enviado un enlace para restablecer tu contraseña.
            </div>

            <div class="text-center text-sm pt-4">
                <a [routerLink]="'/login'" class="text-sm text-orange-500 hover:underline cursor-pointer">← Volver al inicio de sesión</a>
            </div>
        </form>
    </p-card>
</div>

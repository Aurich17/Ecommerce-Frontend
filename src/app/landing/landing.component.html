<!-- Header completo -->
<div class="flex justify-content-between align-items-center px-4 py-2  w-full">

  <!-- Logo -->
  <div class="text-pink-600 font-bold text-xl">
    Fiaox <span class="text-900">Market</span>
  </div>

  <!-- Card para links centrado -->
  <div class="shadow-2 border-round-md bg-white px-4 py-2 flex align-items-center">
    <div class="flex gap-4 text-sm text-800">
      <a class="cursor-pointer">Funcionalidad</a>
      <a class="cursor-pointer">Características</a>
      <a class="cursor-pointer">Testimonios</a>
      <a class="cursor-pointer">Preguntas Frecuentes</a>
      <a class="cursor-pointer">Contáctanos</a>
    </div>
  </div>

  <!-- Botones -->
  <div class="flex gap-2">
    <p-button label="Registrarse" styleClass="p-button-sm p-button-danger" [raised]="true"></p-button>
    <p-button label="Ingresar" styleClass="p-button-sm p-button-outlined p-button-warning"></p-button>
  </div>

</div>

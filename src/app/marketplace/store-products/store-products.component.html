<!-- catalog.component.html -->
<p-toast></p-toast>

<!-- Header reutilizable si lo necesitas -->
<div class="header flex align-items-center justify-content-between">
  <div class="logo-and-search flex align-items-center gap-3">
    <span class="app-logo">FiaoX Market</span>
    <button
      pButton
      type="button"
      label="Marketplace"
      [routerLink]="'/principal/marketplace'"
      severity="warning"
    ></button>
    <input
      pInputText
      class="search"
      type="text"
      placeholder="Buscar productos o empresas en el sistema"
      [(ngModel)]="q"
    />
  </div>
  <div class="actions flex align-items-center gap-3">
    <button
      pButton
      icon="pi pi-shopping-cart"
      (click)="cartOpen = true"
    ></button>
    <i class="pi pi-user text-2xl"></i>
  </div>
</div>

<h2 class="title">Explora nuestros productos</h2>

<div class="grid">
  <!-- Sidebar de filtros -->
  <div class="col-12 md:col-3">
    <div class="filters p-3">
      <div class="block p-fluid p-formgrid p-grid gap-4">
        <div class="field text-xl font-bold">Filtros</div>
        <div class="field">
          <label>Buscar</label>
          <input
            pInputText
            class="w-full mb-3"
            placeholder="Ej. laptop, teléfono..."
            [(ngModel)]="q"
          />
        </div>
        <div class="field">
          <label>Categoría</label>
          <p-dropdown
            class="w-full mb-3"
            [options]="categories"
            [(ngModel)]="category"
          ></p-dropdown>
        </div>
        <div class="field">
          <label>Ordenar por</label>
          <p-dropdown
            class="w-full mb-3"
            [options]="['Relevancia', 'Menor precio', 'Mayor precio']"
            [(ngModel)]="orderBy"
          ></p-dropdown>
        </div>
        <div class="field">
          <label>Rango de precios ($)</label>
          <div class="flex gap-2 mb-2">
            <input pInputText class="w-6" [(ngModel)]="range[0]" />
            <input pInputText class="w-6" [(ngModel)]="range[1]" />
          </div>
          <p-slider
            [(ngModel)]="range"
            [min]="minPrice"
            [max]="maxPrice"
            [range]="true"
          ></p-slider>
        </div>
        <div class="field">
          <div class="mt-3 flex align-items-center gap-2">
            <p-checkbox [(ngModel)]="onlyDiscount" binary="true"></p-checkbox>
            <label>Solo productos con descuento</label>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Grid de productos -->
  <div class="col-12 md:col-9">
    <div class="grid">
      <div class="col-12 sm:col-6 lg:col-3" *ngFor="let p of list">
        <div class="product-card">
          <!-- 👈 wrapper propio -->
          <p-card>
            <div class="thumb">
              <img
                [src]="p.image"
                [alt]="p.name"
                (error)="p.image = 'assets/prod/default.jpg'"
              />
              <span *ngIf="p.discount && p.discount > 0" class="badge"
                >-{{ p.discount }}%</span
              >
            </div>

            <div class="info">
              <h3 class="name" [title]="p.name">{{ p.name }}</h3>
              <div class="price-row">
                <span class="price">$ {{ p.price | number : "1.2-2" }}</span>
              </div>
              <button
                pButton
                class="w-full add-btn"
                icon="pi pi-shopping-bag"
                label="Agregar al carrito"
                (click)="add(p)"
              ></button>
            </div>
          </p-card>
        </div>
      </div>
    </div>
  </div>

  <!-- Sidebar Carrito -->
  <p-sidebar
    [(visible)]="cartOpen"
    position="right"
    [modal]="true"
    [showCloseIcon]="true"
    styleClass="cart w-30rem"
  >
    <ng-template pTemplate="header">
      <span class="font-semibold text-xl">Carrito de Compras</span>
    </ng-template>
    <div class="cart-container" *ngIf="cart.length; else emptyCart">
      <div class="cart-items">
        <div class="cart-item" *ngFor="let ci of cart">
          <div class="flex align-items-center gap-3">
            <img [src]="ci.product.image" alt="" />
            <div class="flex flex-column w-full">
              <div class="flex justify-content-between w-full">
                <div class="flex align-items-center text-normal font-bold">
                  {{ ci.product.name }}
                </div>
                <button
                  pButton
                  icon="pi pi-times"
                  class="p-button-text p-button-danger"
                  (click)="delete(ci)"
                ></button>
              </div>
              <div>
                <div class="sub">
                  $ {{ ci.product.price | number : "1.2-2" }}
                </div>
              </div>
              <div class="pt-3">
                <div class="qty">
                  <p-inputNumber
                    [(ngModel)]="ci.qty"
                    [style]="{ width: '2rem' }"
                    [showButtons]="true"
                    buttonLayout="horizontal"
                    spinnerMode="horizontal"
                    inputId="horizontal"
                    decrementButtonClass="p-button-secondary p-button-rounded p-button-text"
                    incrementButtonClass="p-button-secondary p-button-rounded p-button-text"
                    incrementButtonIcon="pi pi-plus"
                    decrementButtonIcon="pi pi-minus"
                    [min]="0"
                  />
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div>
        <p-divider></p-divider>
        <div class="cart-footer">
          <div class="flex align-items-center justify-content-between">
            <div class="total">Total:</div>
            <div>
              <strong>${{ total.toFixed(2) }}</strong>
            </div>
          </div>
          <div class="p-field p-col-12 flex justify-content-between mt-4 gap-4">
            <button
              pButton
              icon="pi pi-trash"
              class="w-6"
              label="Limpiar"
              [outlined]="true"
              severity="secondary"
              (click)="clear()"
            ></button>
            <button
              pButton
              label="Solicitar"
              class="p-button-warning p-button-sm w-6"
              (click)="submitOrder()"
            ></button>
          </div>
        </div>
      </div>
    </div>

    <ng-template #emptyCart>
      <p>Tu carrito está vacío.</p>
    </ng-template>
  </p-sidebar>
</div>

<div class="flex h-screen">
  <!-- Sidebar fijo -->
  <div
    *ngIf="verMenu"
    class="w-15rem h-full border-right-1 surface-border overflow-auto"
  >
    <div class="text-xl p-4">Fiaox Market</div>

    <p-panelMenu [model]="items" styleClass="flex flex-column h-full gap-4">
      <ng-template pTemplate="item" let-item>
        <ng-container *ngIf="item.route; else urlRef">
          <a
            [routerLink]="item.route"
            class="flex align-items-center cursor-pointer text-color px-3 py-2"
          >
            <span [class]="item.icon"></span>
            <span class="ml-2 text-color">{{ item.label }}</span>
          </a>
        </ng-container>
        <ng-template #urlRef>
          <a
            *ngIf="item.url; else noLink"
            [href]="item.url"
            class="flex align-items-center cursor-pointer text-color px-3 py-2"
          >
            <span [class]="item.icon"></span>
            <span class="ml-2">{{ item.label }}</span>
          </a>
          <ng-template #noLink>
            <span
              class="flex align-items-center cursor-pointer text-color px-3 py-2"
            >
              <span [class]="item.icon"></span>
              <span class="ml-2">{{ item.label }}</span>
              <i
                *ngIf="item.items"
                class="pi pi-angle-down text-primary ml-auto"
              ></i>
            </span>
          </ng-template>
        </ng-template>
      </ng-template>
    </p-panelMenu>
  </div>

  <!-- Columna derecha -->
  <div class="flex-1 h-full flex flex-column min-h-0">
    <p-menubar [model]="itemsMenuBar">
      <ng-template pTemplate="item" let-item let-root="root">
        <a pRipple class="flex align-items-center p-menuitem-link">
          <span [class]="item.icon"></span>
        </a>
      </ng-template>
      <ng-template pTemplate="end">
        <div class="flex align-items-center gap-2">
          <p-avatar
            image="https://primefaces.org/cdn/primeng/images/demo/avatar/amyelsner.png"
            shape="circle"
          ></p-avatar>
        </div>
      </ng-template>
    </p-menubar>

    <!-- Contenido con scroll -->
    <div class="flex-1 overflow-auto p-4">
      <router-outlet></router-outlet>
    </div>
  </div>
</div>

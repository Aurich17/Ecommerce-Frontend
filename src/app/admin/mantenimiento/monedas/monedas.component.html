<form [formGroup]="monedasform" class="block p-fluid p-formgrid p-grid gap-2 p-4">
    <div class="flex justify-content-between w-full">
        <div class="text-lg font-bold">Monedas</div>
        <div class="flex gap-2">
            <p-button icon="pi pi-plus" iconPos="right" label="Agregar Moneda" severity="warning"
                (onClick)="agregarMoneda()" styleClass="text-sm" />
            <p-button icon="pi pi-file-excel" styleClass="text-sm" iconPos="left" label="Excel" severity="success"
                (onClick)="exportExcel()" />
            <p-button icon="pi pi-file-o" styleClass="text-sm" iconPos="left" label="Csv" (onClick)="exportCsv()" />
            <p-button icon="pi pi-file-pdf" styleClass="text-sm" iconPos="left" label="Pdf" severity="danger"
                (onClick)="exportPdf()" />
        </div>
    </div>
    <div class="pt-3">
        <p-table [value]="monedasTable" class="w-full" dataKey="id" editMode="row">
            <ng-template pTemplate="header">
                <tr>
                    <th class="text-sm">Descripción</th>
                    <th class="text-sm">Prefijo</th>
                    <th class="text-sm">Símbolo</th>
                    <th class="text-sm">Estado</th>
                    <th class="text-sm">Acciones</th>
                </tr>
            </ng-template>

            <ng-template pTemplate="body" let-moneda>
                <tr>
                    <td>{{moneda.description}}</td>
                    <td>{{moneda.prefijo}}</td>
                    <td>{{moneda.signo}}</td>
                    <td>
                        <p-tag [value]="moneda.status ? 'Activo' : 'Inactivo'" 
                               [severity]="moneda.status ? 'success' : 'danger'"></p-tag>
                    </td>
                    <td>
                        <p-button icon="pi pi-pencil" [rounded]="true" [text]="true"
                            (onClick)="editarMoneda(moneda)" pTooltip="Editar" />
                        <p-button [icon]="moneda.status ? 'pi pi-eye-slash' : 'pi pi-eye'" 
                                  [rounded]="true" [text]="true"
                                  (onClick)="toggleStatus(moneda)" 
                                  [pTooltip]="moneda.status ? 'Deshabilitar' : 'Habilitar'" />
                        <p-button icon="pi pi-trash" [rounded]="true" [text]="true"
                            (onClick)="eliminarMoneda(moneda)" pTooltip="Eliminar" />
                    </td>
                </tr>
            </ng-template>
        </p-table>
    </div>
</form>

<p-dialog [header]="titulomantenimiento" [modal]="true" [(visible)]="visible"
    [style]="{ width: '60rem', height: 'auto' }">
    <form [formGroup]="monedasform" class="w-full flex flex-column gap-4">
        <!-- Información básica -->
        <div class="flex flex-column gap-3 w-full">
            <label class="font-bold text-sm">Descripción *</label>
            <input pInputText formControlName="description" class="w-full" [readonly]="!addRegister">
            <small *ngIf="monedasform.get('description')?.invalid && monedasform.get('description')?.touched" 
                   class="p-error">La descripción es requerida</small>
        </div>
        
        <div class="flex w-full gap-3">
            <div class="flex flex-column gap-3 w-6">
                <label class="font-bold text-sm">Prefijo *</label>
                <input pInputText formControlName="prefijo" class="w-full" placeholder="Ej: USD, EUR, PEN">
                <small *ngIf="monedasform.get('prefijo')?.invalid && monedasform.get('prefijo')?.touched" 
                       class="p-error">El prefijo es requerido</small>
            </div>
            <div class="flex flex-column gap-3 w-6">
                <label class="font-bold text-sm">Símbolo *</label>
                <input pInputText formControlName="signo" class="w-full" placeholder="Ej: $, €, S/">
                <small *ngIf="monedasform.get('signo')?.invalid && monedasform.get('signo')?.touched" 
                       class="p-error">El símbolo es requerido</small>
            </div>
        </div>

        <!-- Estado -->
        <div class="flex flex-column gap-3 w-full">
            <label class="font-bold text-sm">Estado</label>
            <div class="flex align-items-center gap-2">
                <p-checkbox formControlName="status" inputId="status"></p-checkbox>
                <label for="status" class="text-sm">Activo</label>
            </div>
        </div>

        <!-- Botones -->
        <div class="w-full flex justify-content-end gap-2">
            <p-button label="Cancelar" severity="secondary" (onClick)="visible = false" [disabled]="loading" />
            <p-button [label]="labelbtn" severity="warning" [loading]="loading" (onClick)="guardarData()" />
        </div>
    </form>
</p-dialog>

  <!-- Toast Messages -->
  <p-toast position="top-right" [life]="5000"></p-toast>

  <!-- Confirmation Dialog -->
  <p-confirmDialog
    [style]="{ width: '450px' }"
    icon="pi pi-exclamation-triangle"
    acceptButtonStyleClass="p-button-danger"
    rejectButtonStyleClass="p-button-secondary p-button-outlined"
  >
  </p-confirmDialog>

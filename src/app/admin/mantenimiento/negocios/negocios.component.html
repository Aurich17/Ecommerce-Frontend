<form
  [formGroup]="categoriasForm"
  class="block p-fluid p-formgrid p-grid gap-2 p-4"
>
  <div class="flex justify-content-between w-full">
    <div class="text-lg font-bold">Negocios</div>
    <div class="flex gap-2">
      <p-button
        icon="pi pi-plus"
        iconPos="right"
        label="Agregar Categoría"
        severity="warning"
        (onClick)="agregarCategoria()"
        styleClass="text-sm"
      />
      <p-button
        icon="pi pi-file-excel"
        styleClass="text-sm"
        iconPos="left"
        label="Excel"
        severity="success"
        (onClick)="exportExcel()"
      />
      <p-button
        icon="pi pi-file-o"
        styleClass="text-sm"
        iconPos="left"
        label="Csv"
        (onClick)="exportCsv()"
      />
      <p-button
        icon="pi pi-file-pdf"
        styleClass="text-sm"
        iconPos="left"
        label="Pdf"
        severity="danger"
        (onClick)="exportPdf()"
      />
    </div>
  </div>

  <div class="pt-3">
    <p-table
      [value]="categoriasTable"
      class="w-full"
      dataKey="id"
      [paginator]="true"
      [rows]="10"
      [rowsPerPageOptions]="[10, 20, 50]"
    >
      <ng-template pTemplate="header">
        <tr>
          <!-- <th class="text-sm">ID</th>
          <th class="text-sm">Código</th> -->
          <th class="text-sm">Nombre</th>
          <th class="text-sm">Creado</th>
          <th class="text-sm">Acciones</th>
        </tr>
      </ng-template>
      <ng-template pTemplate="body" let-cat>
        <tr>
          <!-- <td>{{ cat.id }}</td>
          <td>{{ cat.cod_tipo }}</td> -->
          <td>{{ cat.des_tipo }}</td>
          <td>{{ cat.created_at | date : "yyyy-MM-dd HH:mm" }}</td>
          <td>
            <p-button
              icon="pi pi-pencil"
              [rounded]="true"
              [text]="true"
              (onClick)="onEditPopup(cat)"
              pTooltip="Editar"
            />
            <p-button
              icon="pi pi-trash"
              [rounded]="true"
              [text]="true"
              (onClick)="onDeleteRow(cat)"
              pTooltip="Eliminar"
            />
          </td>
        </tr>
      </ng-template>
    </p-table>
  </div>
</form>

<p-dialog
  [header]="tituloMantenimiento"
  [modal]="true"
  [(visible)]="visible"
  [style]="{ width: '40rem', height: 'auto' }"
>
  <form [formGroup]="categoriasForm" class="w-full flex flex-column gap-4">
    <div class="flex flex-column gap-3 w-full">
      <label class="font-bold text-sm">Código *</label>
      <input
        pInputText
        formControlName="codigo"
        placeholder="Ej: 031"
        class="w-full"
        maxlength="3"
        [readonly]="!addRegister"
      />
      <small
        *ngIf="
          categoriasForm.get('codigo')?.invalid &&
          categoriasForm.get('codigo')?.touched
        "
        class="p-error"
        >El código es obligatorio (3 dígitos)</small
      >
    </div>

    <div class="flex flex-column gap-3 w-full">
      <label class="font-bold text-sm">Nombre *</label>
      <input
        pInputText
        formControlName="nombre"
        placeholder="Ej: Accesorios"
        class="w-full"
      />
      <small
        *ngIf="
          categoriasForm.get('nombre')?.invalid &&
          categoriasForm.get('nombre')?.touched
        "
        class="p-error"
        >El nombre es requerido</small
      >
    </div>

    <div class="w-full flex justify-content-end gap-2">
      <p-button
        label="Cancelar"
        severity="secondary"
        (onClick)="visible = false"
        [disabled]="loading"
      />
      <p-button
        [label]="labelBtn"
        severity="warning"
        [loading]="loading"
        (onClick)="guardarData()"
      />
    </div>
  </form>
</p-dialog>

<p-toast></p-toast>
<p-confirmDialog></p-confirmDialog>

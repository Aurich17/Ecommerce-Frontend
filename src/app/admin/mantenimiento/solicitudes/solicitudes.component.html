<form [formGroup]="solicitudesform" class="block p-fluid p-formgrid p-grid gap-2 p-4">
    <div class="flex justify-content-between w-full">
        <div class="text-lg font-bold">Solicitudes</div>
        <div class="flex gap-2 w-5">
            <input pInputText formControlName="nombreapellido" [readOnly]="true" placeholder="Buscar por nombre o apellido..." class="text-xs w-full"/>
            <p-button icon="pi pi-file-excel" styleClass="text-sm" iconPos="left" label="Excel" severity="success"
                (onClick)="exportExcel()" />
            <p-button icon="pi pi-file-o" styleClass="text-sm" iconPos="left" label="Csv" (onClick)="exportCsv()" />
            <p-button icon="pi pi-file-pdf" styleClass="text-sm" iconPos="left" label="Pdf" severity="danger"
                (onClick)="exportPdf()" />
        </div>
    </div>
    <div class="pt-3 w-full">
        <p-selectButton [options]="optionsFiltro" formControlName="selectfiltro" optionLabel="label" optionValue="value" class="filtrobandeja"/>
    </div>
    <div class="pt-3">
        <p-table [value]="solicitudesTable" class="w-full" dataKey="id" editMode="row">
            <ng-template pTemplate="header">
                <tr>
                    <th class="text-sm">ID</th>
                    <th class="text-sm">Cliente</th>
                    <th class="text-sm">Estado</th>
                    <th class="text-sm">Descripción</th>
                    <th class="text-sm">Creado el</th>
                    <th class="text-sm">Acciones</th>
                </tr>
            </ng-template>

            <ng-template pTemplate="body" let-product>
                <tr>
                    <td>{{product.id}}</td>
                    <td>{{product.cliente}}</td>
                    <td><p-tag [value]="product.estado" [severity]="getSeverity(product.estado)" /></td>
                    <td>{{product.descripcion}}</td>
                    <td>{{product.fechacreacion}}</td>
                    <td>
                        <p-button icon="pi pi-pencil" [rounded]="true" [text]="true" (onClick)="onEditPoppup(product)" />
                        <p-button icon="pi pi-trash" [rounded]="true" [text]="true" (onClick)="onDeleteRow(product.id)" />
                    </td>
                </tr>
            </ng-template>
        </p-table>
    </div>
</form>
<p-dialog header="Actualizar Solicitud" [modal]="true" [(visible)]="visible"
    [style]="{ width: '50rem', height: '37rem' }">
    <div class="text-sm">
        Cambia el estado de esta solicitud (aprobar o rechazar)
    </div>
    <div class="pt-4 w-full">
        <form [formGroup]="poppupgroup">
            <div><p-selectButton [options]="stateOptions" formControlName="select" optionLabel="label"
                    optionValue="value" (onChange)="mostrarSeccion($event)" styleClass="w-full" class="filtrobtn"/></div>
            <div *ngIf="infocliente" class="pt-4 w-full flex flex-column">
                <div class="pt-4 w-full flex gap-2">
                    <div class="p-field p-col-12 flex flex-column gap-3 w-6">
                        <label class="font-bold text-sm">Nombre</label>
                        <input pInputText formControlName="nombre" class="w-full" [readOnly]="true" />
                    </div>
                    <div class="p-field p-col-12 flex flex-column gap-3 w-6">
                        <label class="font-bold text-sm">Email</label>
                        <input pInputText formControlName="email" class="w-full" [readOnly]="true" />
                    </div>
                </div>
                <div class="pt-3 w-full flex gap-2">
                    <div class="p-field p-col-12 flex flex-column gap-3 w-6">
                        <label class="font-bold text-sm">Rol</label>
                        <input pInputText formControlName="rol" class="w-full" [readOnly]="true" />
                    </div>
                    <div class="p-field p-col-12 flex flex-column gap-3 w-6">
                        <label class="font-bold text-sm">Social Security</label>
                        <input pInputText formControlName="socialsecurity" class="w-full" [readOnly]="true" />
                    </div>
                </div>

            </div>
            <div *ngIf="!infocliente" class="pt-4 w-full">
                <div class="pt-3 w-full flex gap-2">
                    <div class="p-field p-col-12 flex flex-column gap-3 w-6">
                        <label class="font-bold text-sm">Foto Validación</label>
                        <div class="w-full h-9rem" [ngStyle]="{'background-image': 'url(' + fotovalidacion + ')'}">
                        </div>
                    </div>
                    <div class="p-field p-col-12 flex flex-column gap-3 w-6">
                        <label class="font-bold text-sm">Documento</label>
                        <div class="w-full h-9rem" [ngStyle]="{'background-image': 'url(' + fotodocumento + ')'}">
                        </div>
                    </div>
                </div>
            </div>
            <div class="pt-3 w-full">
                <div class="pt-3 w-full flex gap-2">
                    <div class="p-field p-col-12 flex flex-column gap-3 w-6">
                        <label class="font-bold text-sm">Estado</label>
                        <p-dropdown formControlName="estado" [options]="listaEstado" optionLabel="label"
                            optionValue="label" styleClass="w-full" appendTo="body" />
                    </div>
                </div>
            </div>
            <div class="pt-4 w-full flex justify-content-end">
                <p-button [label]="labelbtn" severity="warning" [loading]="loading" (onClick)="actualizarCliente()" />
            </div>
        </form>
    </div>
</p-dialog>

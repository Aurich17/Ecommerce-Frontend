<form [formGroup]="productosform" class="block p-fluid p-formgrid p-grid gap-2 p-4">
    <div class="flex justify-content-between w-full">
        <div class="text-lg font-bold">Productos</div>
        <div class="flex gap-2">
            <p-button icon="pi pi-plus" iconPos="right" label="Agregar Producto" severity="warning"
                (onClick)="agregarProducto()" styleClass="text-sm" />
            <p-button icon="pi pi-file-excel" styleClass="text-sm" iconPos="left" label="Excel" severity="success"
                (onClick)="exportExcel()" />
            <p-button icon="pi pi-file-o" styleClass="text-sm" iconPos="left" label="Csv" (onClick)="exportCsv()" />
            <p-button icon="pi pi-file-pdf" styleClass="text-sm" iconPos="left" label="Pdf" severity="danger"
                (onClick)="exportPdf()" />
        </div>
    </div>
    <div class="pt-3">
        <p-table [value]="productosTable" class="w-full" dataKey="id" editMode="row">
            <ng-template pTemplate="header">
                <tr>
                    <th class="text-sm">ID</th>
                    <th class="text-sm">Nombre del Producto</th>
                    <th class="text-sm">Descripción</th>
                    <th class="text-sm">Precio</th>
                    <th class="text-sm">Stock</th>
                    <th class="text-sm">Descuento</th>
                    <th class="text-sm">Acciones</th>
                </tr>
            </ng-template>

            <ng-template pTemplate="body" let-product>
                <tr>
                    <td>{{product.id}}</td>
                    <td>{{product.nombre}}</td>
                    <td>{{product.descripcion}}</td>
                    <td>$ {{product.precio}}</td>
                    <td>{{product.stock}}</td>
                    <td>{{product.descuento}}</td>
                    <td>
                        <p-button icon="pi pi-pencil" [rounded]="true" [text]="true"
                            (onClick)="onEditPoppup(product)" />
                        <p-button icon="pi pi-trash" [rounded]="true" [text]="true"
                            (onClick)="onDeleteRow(product.id)" />
                    </td>
                </tr>
            </ng-template>
        </p-table>
    </div>
</form>
<p-dialog [header]="titulomantenimiento" [modal]="true" [(visible)]="visible"
    [style]="{ width: '50rem', height: '40rem' }">
    <form [formGroup]="productosform" class="w-full flex flex-column gap-4">
        <div class="flex flex-column gap-3 w-full">
            <label class="font-bold text-sm">Nombre del Producto</label>
            <input pInputText formControlName="nombre" class="w-full" [readonly]="!addRegister">
        </div>
        <div class="flex flex-column gap-3 w-full">
            <label class="font-bold text-sm">Descripción</label>
            <textarea rows="5" cols="30" class="w-full" pInputTextarea formControlName="descripcion">
        </textarea>
        </div>
        <div class="flex w-full gap-3">
            <div class="flex flex-column gap-3 w-6">
                <label class="font-bold text-sm">Precio</label>
                <p-inputNumber styleClass="w-full" inputId="precio" formControlName="precio" />
            </div>
            <div class="flex flex-column gap-3 w-6">
                <label class="font-bold text-sm">Stock</label>
                <p-inputNumber styleClass="w-full" inputId="stock" formControlName="stock" />
            </div>
        </div>
        <div class="flex w-full gap-3">
            <div class="flex flex-column gap-3 w-6">
                <label class="font-bold text-sm">Descuento</label>
                <p-inputNumber styleClass="w-full" inputId="descuento" formControlName="descuento" />
            </div>
        </div>
        <div class="w-full flex justify-content-end">
            <p-button [label]="labelbtn" severity="warning" [loading]="loading" (onClick)="guardarData()" />
        </div>
    </form>
</p-dialog>

<form [formGroup]="form" class="block p-fluid p-formgrid p-grid gap-2 p-4">
  <div class="flex justify-content-between">
    <div class="text-lg font-bold">Sección: Slider</div>
    <div class="flex gap-2">
      <p-button
        icon="pi pi-plus"
        iconPos="right"
        label="Agregar Item"
        severity="warning"
        (onClick)="agregarItem()"
        styleClass="text-sm"
      />
    </div>
  </div>

  <div class="pt-3">
    <p-table [value]="table" class="w-full" dataKey="id" editMode="row">
      <ng-template pTemplate="header">
        <tr>
          <th class="text-sm">ID</th>
          <th class="text-sm">Vista</th>
          <th class="text-sm">Archivo</th>
          <th class="text-sm">URL</th>
          <th class="text-sm">Estado</th>
          <th class="text-sm">Acciones</th>
        </tr>
      </ng-template>

      <ng-template pTemplate="body" let-row>
        <tr>
          <td>{{ row.id }}</td>
          <td>
            <img
              [src]="row.url"
              alt="slide"
              style="
                width: 120px;
                height: 60px;
                object-fit: cover;
                border-radius: 4px;
              "
            />
          </td>
          <td>{{ row.name_file }}</td>
          <td
            class="max-w-24 whitespace-nowrap overflow-hidden text-overflow-ellipsis"
          >
            {{ row.url }}
          </td>
          <td>
            <span
              class="text-xs"
              [ngClass]="row.status ? 'text-green-500' : 'text-red-400'"
            >
              {{ row.status ? "Activo" : "Inactivo" }}
            </span>
          </td>
          <td>
            <p-button
              icon="pi pi-pencil"
              [rounded]="true"
              [text]="true"
              (onClick)="onEditPoppup(row)"
            />
            <p-button
              icon="pi pi-trash"
              [rounded]="true"
              [text]="true"
              (onClick)="onDeleteRow(row.id)"
            />
          </td>
        </tr>
      </ng-template>
    </p-table>
  </div>
</form>

<p-dialog
  [header]="titulomantenimiento"
  [modal]="true"
  [(visible)]="visible"
  [style]="{ width: '42rem' }"
>
  <!-- MODO AGREGAR: múltiples imágenes -->
  <ng-container *ngIf="addRegister; else editForm">
    <p-fileUpload
      #uploader
      name="sliderFiles[]"
      [multiple]="true"
      [auto]="false"
      [customUpload]="true"
      chooseLabel="Seleccionar imágenes"
      uploadLabel="Subir"
      cancelLabel="Cancelar"
      (uploadHandler)="onUploadHandler($event)"
      (onSelect)="onSelectFiles($event)"
      accept="image/*"
      [maxFileSize]="10_000_000"
    >
      <ng-template pTemplate="content">
        <div class="text-sm text-color-secondary">
          Sube una o varias imágenes para el slider (recomendado 1920×700).
        </div>
      </ng-template>
    </p-fileUpload>

    <div class="w-full flex justify-content-end mt-4">
      <p-button
        label="Subir imágenes"
        severity="warning"
        [loading]="loading"
        (onClick)="uploader.upload()"
      />
    </div>
  </ng-container>

  <!-- MODO EDITAR: un registro -->
  <ng-template #editForm>
    <form [formGroup]="form" class="w-full flex flex-column gap-4">
      <div class="flex flex-column gap-2 w-full">
        <label class="font-bold text-sm">Archivo (name_file)</label>
        <input pInputText formControlName="name_file" class="w-full" />
      </div>

      <div class="flex flex-column gap-2 w-full">
        <label class="font-bold text-sm">URL</label>
        <input pInputText formControlName="url" class="w-full" />
      </div>

      <div class="flex align-items-center gap-2">
        <p-inputSwitch formControlName="status"></p-inputSwitch>
        <label>Activo</label>
      </div>

      <div class="w-full flex justify-content-end">
        <p-button
          [label]="labelbtn"
          severity="warning"
          [loading]="loading"
          (onClick)="guardarData()"
        />
      </div>
    </form>
  </ng-template>
</p-dialog>

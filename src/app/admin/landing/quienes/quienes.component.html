<form [formGroup]="quienesform" class="block p-fluid p-formgrid p-grid gap-2 p-4">
    <div class="flex justify-content-between">
        <div class="text-lg font-bold">Sección: ¿Quiénes pueden usar?</div>
        <div class="flex gap-2">
            <p-button icon="pi pi-plus" iconPos="right" label="Agregar Entidad" severity="warning"
                (onClick)="agregarEntidad()" styleClass="text-sm"/>
            <p-button icon="pi pi-file-excel" styleClass="text-sm" iconPos="left" label="Excel" severity="success"
                (onClick)="exportExcel()" />
            <p-button icon="pi pi-file-o" styleClass="text-sm" iconPos="left" label="Csv" (onClick)="exportCsv()" />
            <p-button icon="pi pi-file-pdf" styleClass="text-sm" iconPos="left" label="Pdf" severity="danger"
                (onClick)="exportPdf()" />
        </div>
    </div>
    <div class="pt-3">
        <p-table [value]="quienesTable" class="w-full" dataKey="id" editMode="row">
            <ng-template pTemplate="header">
                <tr>
                    <th class="text-sm">ID</th>
                    <th class="text-sm">Ícono</th>
                    <th class="text-sm">Entidad</th>
                    <th class="text-sm">Descripción</th>
                    <th class="text-sm">Acciones</th>
                </tr>
            </ng-template>

            <ng-template pTemplate="body" let-product>
                <tr>
                    <td>{{product.id}}</td>
                    <td>{{product.icono}}</td>
                    <td>{{product.entidad}}</td>
                    <td>{{product.descripcion}}</td>
                    <td>
                        <p-button icon="pi pi-pencil" [rounded]="true" [text]="true" (onClick)="onEditPoppup()" />
                        <p-button icon="pi pi-trash" [rounded]="true" [text]="true" (onClick)="onDeleteRow()" />
                    </td>
                </tr>
            </ng-template>
        </p-table>
    </div>
</form>

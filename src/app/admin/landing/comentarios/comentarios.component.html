<form [formGroup]="comentariosform" class="block p-fluid p-formgrid p-grid gap-2 p-4">
    <div class="flex justify-content-between">
        <div class="text-lg font-bold">Sección: Comentarios</div>
        <div class="flex gap-2">
            <p-button icon="pi pi-trash" iconPos="left" label="Excel" styleClass="text-sm" severity="success" (onClick)="exportExcel()" />
            <p-button icon="pi pi-trash" iconPos="left" label="Csv" styleClass="text-sm" (onClick)="exportCsv()" />
            <p-button icon="pi pi-trash" iconPos="left" label="Pdf" styleClass="text-sm" severity="danger" (onClick)="exportPdf()" />
        </div>
    </div>
    <div class="pt-3">
        <p-table [value]="comentariosTable" class="w-full" dataKey="id" editMode="row">
            <ng-template pTemplate="header">
                <tr>
                    <th class="text-sm">ID</th>
                    <th class="text-sm">Comentario</th>
                    <th class="text-sm">Habilitado</th>
                    <th class="text-sm">Cliente</th>
                    <th class="text-sm">Ocupación</th>
                    <th class="text-sm">Creado</th>
                    <th class="text-sm">Acciones</th>
                </tr>
            </ng-template>

            <ng-template pTemplate="body" let-product let-editing="editing" let-ri="rowIndex">
                <tr [pEditableRow]="product">
                    <td>
                        <p-cellEditor>
                            <ng-template pTemplate="input">
                                <input pInputText type="text" [(ngModel)]="product.id" />
                            </ng-template>
                            <ng-template pTemplate="output">
                                {{product.id}}
                            </ng-template>
                        </p-cellEditor>
                    </td>
                    <td>
                        <p-cellEditor>
                            <ng-template pTemplate="input">
                                <input pInputText type="text" [(ngModel)]="product.comentario" required />
                            </ng-template>
                            <ng-template pTemplate="output">
                                {{product.comentario}}
                            </ng-template>
                        </p-cellEditor>
                    </td>
                    <td>
                        <p-cellEditor>
                            <ng-template pTemplate="input">
                                <input pInputText type="text" [(ngModel)]="product.habilitado" required />
                            </ng-template>
                            <ng-template pTemplate="output">
                                {{product.habilitado}}
                            </ng-template>
                        </p-cellEditor>
                    </td>
                    <td>
                        <p-cellEditor>
                            <ng-template pTemplate="input">
                                <input pInputText type="text" [(ngModel)]="product.cliente" required />
                            </ng-template>
                            <ng-template pTemplate="output">
                                {{product.cliente}}
                            </ng-template>
                        </p-cellEditor>
                    </td>
                    <td>
                        <p-cellEditor>
                            <ng-template pTemplate="input">
                                <input pInputText type="text" [(ngModel)]="product.ocupacion" required />
                            </ng-template>
                            <ng-template pTemplate="output">
                                {{product.ocupacion}}
                            </ng-template>
                        </p-cellEditor>
                    </td>
                    <td>
                        <p-cellEditor>
                            <ng-template pTemplate="input">
                                <input pInputText type="text" [(ngModel)]="product.creado" required />
                            </ng-template>
                            <ng-template pTemplate="output">
                                {{product.creado}}
                            </ng-template>
                        </p-cellEditor>
                    </td>
                    <td>
                        <div class="flex align-items-center justify-content-center gap-2">
                            <button *ngIf="!editing" pButton pRipple type="button" pInitEditableRow icon="pi pi-pencil"
                                (click)="onRowEditInit(product)" class="p-button-rounded p-button-text">
                            </button>
                            <button *ngIf="editing" pButton pRipple type="button" pSaveEditableRow icon="pi pi-check"
                                (click)="onRowEditSave(product)"
                                class="p-button-rounded p-button-text p-button-success mr-2">
                            </button>
                            <button *ngIf="editing" pButton pRipple type="button" pCancelEditableRow icon="pi pi-times"
                                (click)="onRowEditCancel(product, ri)"
                                class="p-button-rounded p-button-text p-button-danger">
                            </button>
                            <button pButton pRipple type="button" icon="pi pi-trash"
                                (click)="onRowEditDelete(product, ri)"
                                class="p-button-rounded p-button-text p-button-danger">
                            </button>
                        </div>
                    </td>
                </tr>
            </ng-template>
        </p-table>
    </div>
</form>

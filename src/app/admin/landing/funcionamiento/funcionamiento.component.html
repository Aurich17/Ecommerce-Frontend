<form [formGroup]="funcionamientoform" class="block p-fluid p-formgrid p-grid gap-2 p-4">
    <div class="flex justify-content-between">
        <div class="text-lg font-bold">Sección: ¿Cómo funciona?</div>
        <div class="flex gap-2">
            <p-button icon="pi pi-plus" iconPos="right" label="Agregar Item" severity="warning"
                (onClick)="agregarItem()" styleClass="text-sm" />
            <p-button icon="pi pi-file-excel" styleClass="text-sm" iconPos="left" label="Excel" severity="success"
                (onClick)="exportExcel()" />
            <p-button icon="pi pi-file-o" styleClass="text-sm" iconPos="left" label="Csv" (onClick)="exportCsv()" />
            <p-button icon="pi pi-file-pdf" styleClass="text-sm" iconPos="left" label="Pdf" severity="danger"
                (onClick)="exportPdf()" />
        </div>
    </div>
    <div class="pt-3">
        <p-table [value]="funcionamientoTable" class="w-full" dataKey="id" editMode="row">
            <ng-template pTemplate="header">
                <tr>
                    <th class="text-sm">ID</th>
                    <th class="text-sm">Ícono</th>
                    <th class="text-sm">Descripción</th>
                    <th class="text-sm">Acciones</th>
                </tr>
            </ng-template>

            <ng-template pTemplate="body" let-product>
                <tr>
                    <td>{{product.id}}</td>
                    <td>{{product.icon}}</td>
                    <td>{{product.description}}</td>
                    <td>
                        <p-button icon="pi pi-pencil" [rounded]="true" [text]="true"
                            (onClick)="onEditPoppup(product)" />
                        <p-button icon="pi pi-trash" [rounded]="true" [text]="true" (onClick)="onDeleteRow()" />
                    </td>
                </tr>
            </ng-template>
        </p-table>
    </div>
</form>
<p-dialog [header]="titulomantenimiento" [modal]="true" [(visible)]="visible"
    [style]="{ width: '50rem', height: '28rem' }">
    <form [formGroup]="funcionamientoform" class="w-full flex flex-column gap-4">
        <div class="flex flex-column gap-3 w-full">
            <label class="font-bold text-sm">Ícono</label>
            <input pInputText formControlName="icono" class="w-full" [readonly]="!addRegister">
        </div>
        <div class="flex flex-column gap-3 w-full">
            <label class="font-bold text-sm">Descripción</label>
            <textarea rows="5" cols="30" class="w-full" pInputTextarea formControlName="descripcion">
        </textarea>
        </div>
        <div class="w-full flex justify-content-end">
            <p-button [label]="labelbtn" severity="warning" [loading]="loading" (onClick)="guardarData()" />
        </div>
    </form>
</p-dialog>

<div class="flex flex-column gap-4">
    <p-card>
        <ng-template pTemplate="header">
            <div class="flex justify-content-between">
                <div class="p-3 font-bold text-lg">
                    Características
                </div>
                <div class="p-3 font-bold text-sm">
                    <p-button icon="pi pi-plus" [rounded]="true" [outlined]="true" (onClick)="addRow('C')" />
                </div>
            </div>
        </ng-template>
        <p-table [value]="caracteristicasTable" class="w-full" dataKey="id" editMode="row">
            <ng-template pTemplate="header">
                <tr>
                    <th class="text-sm">ID</th>
                    <th class="text-sm">Ícono</th>
                    <th class="text-sm">Título</th>
                    <th class="text-sm">Descripción</th>
                    <th class="text-sm">Acciones</th>
                </tr>
            </ng-template>

            <ng-template pTemplate="body" let-product>
                <tr>
                    <td>{{product.id}}</td>
                    <td>{{product.icono}}</td>
                    <td>{{product.titulo}}</td>
                    <td>{{product.descripcion}}</td>
                    <td>
                        <p-button icon="pi pi-pencil" [rounded]="true" [text]="true"
                            (onClick)="onEditPoppup(product, 'C')" />
                        <p-button icon="pi pi-trash" [rounded]="true" [text]="true"
                            (onClick)="onDeleteRow(product, 'C')" />
                    </td>
                </tr>
            </ng-template>
        </p-table>
    </p-card>
    <p-card>
        <ng-template pTemplate="header">
            <div class="flex justify-content-between">
                <div class="p-3 font-bold text-lg">
                    Preguntas Frecuentes
                </div>
                <div class="p-3 font-bold text-sm">
                    <p-button icon="pi pi-plus" [rounded]="true" [outlined]="true" (onClick)="addRow('P')" />
                </div>
            </div>
        </ng-template>
        <p-table [value]="preguntasTable" class="w-full">
            <ng-template pTemplate="header" class="text-xs">
                <tr>
                    <th class="text-sm">ID</th>
                    <th class="text-sm">Pregunta</th>
                    <th class="text-sm">Respuesta</th>
                    <th class="text-sm">Acciones</th>
                </tr>
            </ng-template>
            <ng-template pTemplate="body" let-product>
                <tr>
                    <td>{{product.id}}</td>
                    <td>{{product.pregunta}}</td>
                    <td>{{product.respuesta}}</td>
                    <td>
                        <p-button icon="pi pi-pencil" [rounded]="true" [text]="true"
                            (onClick)="onEditPoppup(product, 'P')" />
                        <p-button icon="pi pi-trash" [rounded]="true" [text]="true"
                            (onClick)="onDeleteRow(product, 'P')" />
                    </td>
                </tr>
            </ng-template>
        </p-table>
    </p-card>
</div>

<p-dialog [header]="titulomantenimiento" [modal]="true" [(visible)]="visible"
    [style]="{ width: '50rem', height: '34rem' }">
    <form [formGroup]="cuerpoform" class="w-full flex flex-column gap-4">
        <div *ngIf="isfeature" class="w-full flex flex-column gap-3">
            <div class="w-full flex gap-3">
                <div class="flex flex-column gap-3 w-6">
                    <label class="font-bold text-sm">Ícono</label>
                    <input pInputText formControlName="icono" class="w-full" [readonly]="true">
                </div>
                <div class="flex flex-column gap-3 w-6">
                    <label class="font-bold text-sm">Título</label>
                    <input pInputText formControlName="titulo" class="w-full" [readonly]="true">
                </div>
            </div>
            <div class="flex flex-column gap-3 w-full">
                <label class="font-bold text-sm">Descripción</label>
                <textarea rows="5" cols="30" class="w-full" pInputTextarea formControlName="descripcion"></textarea>
            </div>
        </div>
        <div *ngIf="!isfeature" class="w-full flex flex-column gap-3">
            <div class="flex flex-column gap-3 w-full">
                <label class="font-bold text-sm">Pregunta</label>
                <input pInputText formControlName="pregunta" class="w-full" [readonly]="true">
            </div>
            <div class="flex flex-column gap-3 w-full">
                <label class="font-bold text-sm">Respuesta</label>
                <textarea rows="5" cols="30" class="w-full" pInputTextarea formControlName="respuesta"></textarea>
            </div>
        </div>
        <div class="w-full flex gap-3 pt-2">
            <div class="flex flex-column gap-3 w-6">
                <label class="font-bold text-sm">Activo</label>
                <p-dropdown formControlName="estado" [options]="listaEstado" optionLabel="label" optionValue="value"
                    styleClass="w-full" appendTo="body" [disabled]="!addRegister" />
            </div>
            <div class="flex flex-column gap-3 w-6">
                <label class="font-bold text-sm">Número de Orden</label>
                <p-inputNumber inputId="orden" styleClass="w-full" formControlName="orden" />
            </div>
        </div>
        <div class="w-full flex justify-content-end">
            <p-button [label]="labelbtn" severity="warning" [loading]="loading" (onClick)="guardarData()" />
        </div>
    </form>
</p-dialog>

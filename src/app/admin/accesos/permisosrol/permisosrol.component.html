<div class="flex flex-column gap-4">
    <div class="text-lg font-bold">Permisos del Rol</div>
    <div class="text-sm">Estás editando los permisos del rol: {{descripcionrol}}</div>

    <!-- Controles de cambios masivos -->
    <div class="flex gap-2 align-items-center" *ngIf="hasPendingChanges">
        <p-button
            label="Guardar Cambios"
            icon="pi pi-check"
            severity="success"
            size="small"
            [loading]="isSaving"
            (onClick)="guardarCambiosMasivos()">
        </p-button>
        <p-button
            label="Descartar"
            icon="pi pi-times"
            severity="secondary"
            size="small"
            [disabled]="isSaving"
            (onClick)="descartarCambios()">
        </p-button>
        <span class="text-sm text-orange-600">
            <i class="pi pi-exclamation-triangle"></i>
            Tienes {{pendingChanges.size}} cambio(s) pendiente(s)
        </span>
    </div>
</div>
<div class="pt-3">
    <p-accordion [multiple]="true">
        <p-accordionTab *ngFor="let group of menuGroups" [header]="group.nombre">
            <p-table [value]="group.permisos" class="w-full" dataKey="id" editMode="row">
                <ng-template pTemplate="header">
                    <tr>
                        <th class="text-sm">#</th>
                        <th class="text-sm">Módulo</th>
                        <th class="text-sm">Acceso</th>
                        <th class="text-sm">Ver</th>
                        <th class="text-sm">Agregar</th>
                        <th class="text-sm">Editar</th>
                        <th class="text-sm">Eliminar</th>
                    </tr>
                </ng-template>

                <ng-template pTemplate="body" let-product>
                    <tr [class.bg-yellow-50]="product.hasChanges">
                        <td>
                            {{product.id}}
                            <i class="pi pi-circle-fill text-orange-500 ml-2"
                               *ngIf="product.hasChanges"
                               style="font-size: 0.5rem"
                               title="Fila modificada">
                            </i>
                        </td>
                        <td>{{product.nombre}}</td>
                        <td><p-checkbox [binary]="true" [inputId]="'acceso_' + product.id" [(ngModel)]="product.acceso" (onChange)="seleccionarPermiso($event, product, 'acceso')" /></td>
                        <td><p-checkbox [binary]="true" [inputId]="'ver_' + product.id" [(ngModel)]="product.ver" (onChange)="seleccionarPermiso($event, product, 'ver')" /></td>
                        <td><p-checkbox [binary]="true" [inputId]="'agregar_' + product.id" [(ngModel)]="product.agregar" (onChange)="seleccionarPermiso($event, product, 'agregar')" /></td>
                        <td><p-checkbox [binary]="true" [inputId]="'editar_' + product.id" [(ngModel)]="product.editar" (onChange)="seleccionarPermiso($event, product, 'editar')" /></td>
                        <td><p-checkbox [binary]="true" [inputId]="'eliminar_' + product.id" [(ngModel)]="product.eliminar" (onChange)="seleccionarPermiso($event, product, 'eliminar')" /></td>
                    </tr>
                </ng-template>
            </p-table>
        </p-accordionTab>
    </p-accordion>
</div>

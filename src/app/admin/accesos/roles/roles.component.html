<div class="flex justify-content-between">
    <div class="text-lg font-bold">Lista de Roles</div>
    <div class="flex gap-2">
        <p-button icon="pi pi-plus" iconPos="right" label="Agregar Rol" severity="warning"
            (onClick)="agregarRol()" styleClass="text-sm" />
    </div>
</div>
<div class="pt-3">
    <p-table [value]="rolesTable" class="w-full" dataKey="id" editMode="row">
        <ng-template pTemplate="header">
            <tr>
                <th class="text-sm">ID</th>
                <th class="text-sm">Nombre de Rol</th>
                <th class="text-sm">Descripción</th>
                <th class="text-sm">Fecha de Creación</th>
                <th class="text-sm">Acciones</th>
            </tr>
        </ng-template>

        <ng-template pTemplate="body" let-product>
            <tr>
                <td>{{product.id}}</td>
                <td>{{product.nombre}}</td>
                <td>{{product.descripcion}}</td>
                <td>{{product.fechacreacion}}</td>
                <td>
                    <p-button icon="pi pi-pencil" label="Editar Permisos" [text]="true" [raised]="true" (onClick)="onEditPermisos(product)" />
                </td>
            </tr>
        </ng-template>
    </p-table>
</div>
